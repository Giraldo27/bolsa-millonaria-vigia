name: Bot, mensajes pendientes (manual; lo reemplaza el Vigía)

# MODO ANTIGUO (sólo botón manual). Desde el 5-oct-2026 todo lo hace el flujo "Vigía" (vigia.yml) en un proceso continuo; este se dejó sin horario para que
# no choque con él (comparten el estado y Telegram sólo admite un lector por bot). Úsalo sólo con el vigía APAGADO.
# GitHub no puede dejar un programa escuchando todo el día. Este flujo revisa los mensajes pendientes del bot (python bot.py --una-vez), los contesta y termina,
# así que las respuestas llegan con unos minutos de retraso. De día (13:00-21:45 UTC) los contesta el flujo del monitor en cada corrida; este cubre la NOCHE:
# cada 20 minutos de 00:00 a 03:40 UTC = 19:00 a 22:40 en Bogotá, de lunes a viernes (martes a sábado en UTC), para que tu /rank después del radar se atienda pronto.
#
# IMPORTANTE: Telegram sólo permite UN lector de mensajes por bot. El bot del PC (bot.py) debe estar APAGADO (error 409 si no).
on:
  workflow_dispatch:

concurrency:
  group: bolsa-estado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-nube.txt
      - run: pip install -r requirements-nube.txt
      - name: Recuperar el estado
        run: python nube/sincronizar_estado.py bajar
      - name: Contestar mensajes pendientes
        run: python bot.py --una-vez
      - name: Guardar el estado
        if: always()
        run: python nube/sincronizar_estado.py subir
