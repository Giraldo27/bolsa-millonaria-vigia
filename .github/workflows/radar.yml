name: Radar de la noche (manual; lo reemplaza el Vigía)

# MODO ANTIGUO (sólo botón manual). Desde el 5-oct-2026 todo lo hace el flujo "Vigía" (vigia.yml) en un proceso continuo; este se dejó sin horario para que
# no choque con él (comparten el estado y Telegram sólo admite un lector por bot). Úsalo sólo con el vigía APAGADO.
# 19:30 en Bogotá = 00:30 UTC del día siguiente, así que lunes a jueves en Colombia es martes a viernes en UTC.
on:
  workflow_dispatch:

concurrency:
  group: bolsa-estado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-nube.txt
      - run: pip install -r requirements-nube.txt
      - name: Recuperar el estado
        run: python nube/sincronizar_estado.py bajar
      - name: Radar
        run: python radar.py
      - name: Contestar tus mensajes pendientes (comandos del bot)
        continue-on-error: true
        run: python bot.py --una-vez
      - name: Guardar el estado
        if: always()
        run: python nube/sincronizar_estado.py subir
